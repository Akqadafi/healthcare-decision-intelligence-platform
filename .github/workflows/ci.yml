name: Portfolio CI

on:
  push:
    branches: [main, master, "agent/**", "codex/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -e ".[dev,analysis]"
      - run: ruff check .
      - run: pytest
      - run: python -m healthcare_di.pipeline
      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-evidence
          path: |
            data/gold/data_quality_report.csv
            data/gold/build_manifest.json

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: community-health-intelligence:ci

      - name: Verify bundled data and all dashboard pages
        run: docker run --rm --entrypoint python community-health-intelligence:ci /app/scripts/verify_dashboard.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check rendered scores, county locations, and scenario persistence
        run: |
          docker run -d --name dashboard-ci -p 127.0.0.1:8501:8501 community-health-intelligence:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          python scripts/cloud_dashboard_smoke.py --url http://127.0.0.1:8501 --evidence evidence/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-evidence
          path: evidence/browser
      - name: Stop test dashboard
        if: always()
        run: docker rm -f dashboard-ci || true
