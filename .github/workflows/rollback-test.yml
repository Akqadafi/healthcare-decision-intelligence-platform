name: Controlled dev rollback test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type healthcare-di-dev to confirm the dedicated failure-test service
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: healthcare-di-dev-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'healthcare-di-dev'
    uses: ./.github/workflows/ci.yml
  rollback:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify reviewed AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
      - name: Inject failing health command and verify rollback to A
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          TARGET: ${{ vars.TARGET_GROUP_ARN }}
          APP_LOG: ${{ vars.APPLICATION_LOG_GROUP }}
          EVENT_LOG: ${{ vars.DEPLOYMENT_LOG_GROUP }}
          URL: ${{ vars.DASHBOARD_URL }}
        run: |
          python scripts/aws_release.py rollback-test --account "$ACCOUNT" --cluster "$CLUSTER" --service "$SERVICE" --target-group "$TARGET" --application-log "$APP_LOG" --event-log "$EVENT_LOG" --url "$URL" --evidence evidence/rollback
      - name: Verify recovered dashboard and capture screenshots
        env:
          URL: ${{ vars.DASHBOARD_URL }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/cloud_dashboard_smoke.py --url "$URL" --evidence evidence/rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-${{ github.run_id }}
          path: evidence/rollback
          retention-days: 30
